<script>
(async()=>{
const ID="labo-buchette",R="../",K="GG_admin_cles";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=i=>document.getElementById(i);
async function ouvrir(raw){
 const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 const d=b64($("payload").textContent.replace(/\s/g,""));
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},k,d.slice(12));
 const t=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
 document.open();document.write(t);document.close();}
function coffre(){try{const v=JSON.parse(localStorage.getItem(K)||"null");if(v&&v.exp>Date.now())return v.cles;localStorage.removeItem(K)}catch(e){}return null}
try{const r=await fetch(R+"acces.json?t="+Date.now(),{cache:"no-store"});const a=await r.json();if(a.ouvert&&a.ouvert[ID])return ouvrir(b64(a.ouvert[ID]));}catch(e){}
const c=coffre();if(c&&c[ID])return ouvrir(b64(c[ID]));
$("verrou").hidden=false;
$("f").onsubmit=async e=>{e.preventDefault();$("msg").textContent="Vérification…";
 try{const j=await (await fetch(R+"cles.json?t="+Date.now(),{cache:"no-store"})).json();
  const pw=new TextEncoder().encode($("mdp").value.trim().normalize("NFC"));
  const bk=await crypto.subtle.importKey("raw",pw,"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(j.sel),iterations:j.iter,hash:"SHA-256"},bk,{name:"AES-GCM",length:256},false,["decrypt"]);
  const d=b64(j.coffre);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},key,d.slice(12));
  const cles=JSON.parse(new TextDecoder().decode(pt));
  localStorage.setItem(K,JSON.stringify({exp:Date.now()+($("souv").checked?30*864e5:12*36e5),cles}));
  ouvrir(b64(cles[ID]));
 }catch(err){$("msg").textContent="Mot de passe incorrect."}};
})();
</script>
