<style>

    --navy: #9CC0E6; --accentSoft: #22364A; --ok: #6CC48A; --okBg: #173024; --bad: #F08A80; --badBg: #3A1E1C;
    --warnBg: #352C12; --warnInk: #F2D58A; --water: #3C6C94; --waterLine: #8EC3EE; --milky: #C9CFCC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #10171D; --panel: #18232C; --panel2: #1D2A34; --ink: #E4ECF1; --muted: #9AABB7; --line: #2C3A45;
  --navy: #9CC0E6; --accentSoft: #22364A; --ok: #6CC48A; --okBg: #173024; --bad: #F08A80; --badBg: #3A1E1C;
  --warnBg: #352C12; --warnInk: #F2D58A; --water: #3C6C94; --waterLine: #8EC3EE; --milky: #C9CFCC;
  color-scheme: dark;
}
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font-family: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif; font-size: 16px; margin: 0; line-height: 1.45; }
body.tableau { font-size: 21px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 2.5vw, 32px); padding-block: 14px 40px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: "Bricolage Grotesque", "Atkinson Hyperlegible", Arial, sans-serif; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(22px, 3vw, 32px); font-weight: 800; letter-spacing: -.3px; }
h2 { font-size: 1.2em; }
button, select, input { font: inherit; }
button { cursor: pointer; border-radius: 10px; border: 2px solid var(--navy); background: var(--panel); color: var(--navy); padding: 7px 13px; font-weight: 700; }
button.primary { background: var(--navy); color: var(--panel); }
button.ghost { border-color: var(--line); color: var(--ink); font-weight: 400; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, .chip:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
select, input[type=text] { padding: 5px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); max-width: 100%; }
input[type=text] { width: 7.5em; text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.tag { font-size: 12px; letter-spacing: .7px; text-transform: uppercase; font-weight: 700; color: var(--muted); }

/* En-tête */
.top { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; }
.lvl { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 26px; background: var(--accent); color: #fff; border-radius: 12px; padding: 4px 12px; line-height: 1.2; }
.top .spacer { flex: 1; }
.serie { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.serie input { width: 5.5em; text-align: center; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }

/* Onglets */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--line); padding-bottom: 8px; }
.tabs button { border: 1.5px solid var(--line); color: var(--ink); background: var(--panel); font-weight: 700; display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 6px 12px; text-align: left; }
.tabs button small { font-weight: 400; color: var(--muted); font-size: .8em; }
.tabs button[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: var(--panel); }
.tabs button[aria-selected="true"] small { color: var(--panel); opacity: .85; }
.tabs button.easy { border-style: dashed; border-color: var(--ok); }
.tabs button.easy[aria-selected="true"] { background: var(--ok); border-color: var(--ok); border-style: solid; }

.intro { color: var(--muted); max-width: 75ch; }

/* Carte d'exercice */
.ex { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px clamp(14px, 2vw, 22px); display: flex; flex-direction: column; gap: 14px; }
.ex-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.ex-head h2 { flex: 1; min-width: 12em; }
.ex-head .badge { font-size: 12px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; background: var(--accentSoft); color: var(--navy); border-radius: 6px; padding: 2px 8px; }
.item { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid transparent; background: var(--panel2); }
.item.ok { border-color: var(--ok); background: var(--okBg); }
.item.bad { border-color: var(--bad); background: var(--badBg); }
.item .q { font-weight: 700; }
.item .q .lettre { display: inline-block; min-width: 1.6em; color: var(--navy); }
.explain { font-size: .95em; background: var(--warnBg); color: var(--warnInk); border-radius: 8px; padding: 6px 10px; }
.ex-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.score { font-weight: 700; font-variant-numeric: tabular-nums; }
.score.full { color: var(--ok); }
details.hint { background: var(--warnBg); color: var(--warnInk); border-radius: 8px; padding: 6px 10px; }
details.hint summary { cursor: pointer; font-weight: 700; }

/* QCM */
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1.5px solid var(--line); color: var(--ink); background: var(--panel); font-weight: 400; text-align: left; }
.opt[aria-pressed="true"] { border-color: var(--navy); background: var(--accentSoft); font-weight: 700; }
.opt.right { border-color: var(--ok); background: var(--okBg); }
.opt.wrong { border-color: var(--bad); background: var(--badBg); }

/* Tableau */
.tscroll { overflow-x: auto; max-width: 100%; }
table.grid { border-collapse: collapse; background: var(--panel); }
table.grid th, table.grid td { border: 1px solid var(--line); padding: 6px 9px; text-align: center; vertical-align: middle; }
table.grid th { background: var(--accentSoft); color: var(--navy); font-weight: 700; }
table.grid td.rowh { font-weight: 700; text-align: left; }
.cell-ok { outline: 2.5px solid var(--ok); outline-offset: -2px; background: var(--okBg); }
.cell-bad { outline: 2.5px solid var(--bad); outline-offset: -2px; background: var(--badBg); }
.fix { display: block; font-size: .85em; color: var(--ok); font-weight: 700; }
.unit { margin-left: 4px; }

/* Ordre */
.pool, .seq { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; align-items: center; }
.seq { flex-direction: column; align-items: stretch; background: var(--panel); border: 1.5px dashed var(--line); border-radius: 10px; padding: 8px; }
.seq .ph { color: var(--muted); font-style: italic; }
.chip { cursor: pointer; border-radius: 999px; border: 1.5px solid var(--navy); background: var(--panel); color: var(--ink); padding: 5px 12px; font-weight: 400; }
.seq .chip { border-radius: 10px; text-align: left; }
.seq .chip b { color: var(--navy); margin-right: 6px; }
.chip[aria-pressed="true"] { background: var(--navy); color: var(--panel); }
.chip.right { border-color: var(--ok); background: var(--okBg); color: var(--ink); }
.chip.wrong { border-color: var(--bad); background: var(--badBg); color: var(--ink); }
.chip.fixed { cursor: default; border-style: dotted; }

/* Tri */
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.bin { background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 90px; cursor: pointer; }
.bin h3 { font-size: .95em; color: var(--navy); }
.bin .inbin { display: flex; flex-wrap: wrap; gap: 6px; }
.bin.target { border-color: var(--navy); border-style: dashed; }

/* Figures */
figure.fig { margin: 0; overflow-x: auto; }
figure.fig svg { display: block; width: 100%; max-width: 560px; height: auto; }
.figrow figure svg { max-width: 100%; }
figure.fig figcaption { font-size: .9em; color: var(--muted); }
.figrow { display: flex; flex-wrap: wrap; gap: 12px; }
.figrow figure { flex: 0 1 220px; min-width: 140px; }
.figrow figure.wide { flex: 1 1 320px; max-width: 460px; }
svg text { fill: var(--ink); font-family: "Atkinson Hyperlegible", Arial, sans-serif; }
svg .ax { stroke: var(--ink); stroke-width: 1.6; fill: none; }
svg .gr { stroke: var(--line); stroke-width: 1; }
svg .gr2 { stroke: var(--line); stroke-width: .5; opacity: .7; }
svg .c1 { stroke: var(--navy); stroke-width: 2.6; fill: none; }
svg .c2 { stroke: #C0571B; stroke-width: 2.6; fill: none; }
svg .pt { fill: var(--navy); }
svg .ptT { fill: none; stroke: var(--ok); stroke-width: 2.4; }
svg .ptBad { fill: var(--bad); }
svg .glass { fill: none; stroke: var(--muted); stroke-width: 2.4; }
svg .water { fill: var(--water); }
svg .wline { stroke: var(--waterLine); stroke-width: 2; }
svg .milky { fill: var(--milky); }
svg .box { fill: var(--panel); stroke: var(--navy); stroke-width: 2; }
svg .arr { stroke: var(--navy); stroke-width: 2.2; fill: none; }
svg .arrh { fill: var(--navy); }
svg .num { fill: var(--navy); }
svg .numt { fill: var(--panel); font-weight: 700; }
svg .part { fill: var(--ink); }
svg .solidbk { fill: #C9955A; stroke: #7A5227; stroke-width: 2; }
svg .tray { fill: var(--panel2); stroke: var(--muted); stroke-width: 2; }
svg .plotarea { cursor: crosshair; fill: transparent; }

/* Flash */
.flash { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 3vw, 34px); display: flex; flex-direction: column; gap: 18px; min-height: 280px; }
.flash .fq { font-size: 1.55em; font-weight: 700; font-family: "Bricolage Grotesque", sans-serif; max-width: 40ch; text-wrap: balance; }
.flash .fa { font-size: 1.3em; background: var(--okBg); border: 2px solid var(--ok); border-radius: 12px; padding: 12px 16px; }
.flash .theme { font-size: 13px; letter-spacing: .6px; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.flash .cnt { font-variant-numeric: tabular-nums; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.3em; color: var(--navy); }

.oral { font-style: italic; color: var(--muted); }
.ans { background: var(--okBg); border: 1.5px solid var(--ok); border-radius: 8px; padding: 6px 10px; }
footer { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: no-preference) {
  .item, .opt, .chip { transition: background-color .15s, border-color .15s; }
}
@media (max-width: 520px) {
  .lvl { font-size: 20px; }
  .flash .fq { font-size: 1.25em; }
}

/* Dessin mystère */
.brush .sw { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 6px; font-weight: 700; }
.mgrid { display: grid; gap: 3px; max-width: 520px; touch-action: none; user-select: none; }
.mcell { aspect-ratio: 1 / 1; border: 1.5px solid var(--line); border-radius: 6px; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
.mcell .msym { font-size: 1.4em; line-height: 1; font-weight: 700; min-height: 1em; }
.mcell .mword { font-size: .68em; color: var(--muted); text-align: center; line-height: 1.1; padding-inline: 2px; overflow-wrap: anywhere; }
.mS { background: #E6C9A5; color: #6B3F14; } .mL { background: #BFDCF3; color: #1E5A94; } .mG { background: #F6CBC4; color: #B3261E; }
.mcell.mS .mword, .mcell.mL .mword, .mcell.mG .mword { color: #2B2B2B; }
.mcell.mbad { outline: 3px solid var(--bad); outline-offset: -3px; }

/* Défi */
.progress { display: flex; gap: 5px; }
.progress .pg { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.progress .pg.cur { background: var(--navy); }
.progress .pg.ok { background: var(--ok); }
.progress .pg.bad { background: var(--bad); }
.ladder { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; counter-reset: l; }
.ladder li { border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: .9em; background: var(--panel2); }
.ladder li.done { border-color: var(--ok); }
.ladder li.here { background: var(--navy); border-color: var(--navy); color: var(--panel); font-weight: 700; }
.result { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 24px; }
.result .note { font-family: "Bricolage Grotesque", sans-serif; font-size: 3em; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
.result .titre { font-family: "Bricolage Grotesque", sans-serif; font-size: 1.8em; font-weight: 800; }
.progress .pg.half { background: #E3AE0E; }
button.expert { background: #5B2A86; border-color: #5B2A86; color: #fff; }
.metier { display: inline-block; font-size: .78em; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: #5B2A86; background: #EEE4F7; border-radius: 6px; padding: 1px 8px; margin-bottom: 4px; }
:root[data-theme="dark"] .metier { background: #2E2340; color: #D6BEF0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .metier { background: #2E2340; color: #D6BEF0; } }

/* Collectif */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.card { display: flex; align-items: center; gap: 12px; border-radius: 14px; padding: 14px 16px; color: #fff; font-size: 1.2em; font-weight: 700; min-height: 64px; transition: opacity .2s; }
.card .num { font-family: "Bricolage Grotesque", sans-serif; font-size: 1.8em; min-width: 1em; }
.card .shape { font-size: 1.3em; opacity: .9; }
.card .txt { flex: 1; }
.card.c1 { background: #C0392B; } .card.c2 { background: #1F5FA8; } .card.c3 { background: #B7860B; } .card.c4 { background: #22804A; }
.card.dim { opacity: .25; }

/* Collectif : couleurs et gestes */
.card.cV { background: #22804A; } .card.cO { background: #D9660F; } .card.cJ { background: #F2C318; color: #2B2200; } .card.cB { background: #1F5FA8; }
.card .num { font-size: 2em; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.legend .lg { display: flex; gap: 10px; align-items: center; border-radius: 10px; padding: 6px 10px; color: #fff; font-size: .95em; }
.legend .lg > b { font-family: "Bricolage Grotesque", sans-serif; font-size: 1.8em; line-height: 1; min-width: 1em; }
.legend .lg.cV { background: #22804A; } .legend .lg.cO { background: #D9660F; } .legend .lg.cJ { background: #F2C318; color: #2B2200; } .legend .lg.cB { background: #1F5FA8; }

/* Tirage et plan de classe */
.tirage { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.tirout { font-size: 1.15em; min-height: 1.4em; }
.plan { display: flex; flex-direction: column; gap: 6px; max-width: 520px; }
.prow { display: grid; grid-template-columns: repeat(4, 1fr) .6fr repeat(4, 1fr); gap: 5px; }
.seat { padding: 6px 0; border-radius: 8px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.seat.none { border: none; background: transparent; }
.seat.vide { background: var(--panel2); color: var(--muted); text-decoration: line-through; border-style: dashed; }
.seat.cible { background: #E3AE0E; border-color: #B58400; color: #1E1600; }
.board { text-align: center; font-weight: 700; letter-spacing: 3px; border-top: 4px double var(--ink); padding-top: 4px; }
.small { font-size: .85em; }

/* Cartes flash */
.fcard { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 240px; border-radius: 18px; border: 2px solid var(--navy); background: var(--panel); color: var(--ink); font-size: 1.5em; font-weight: 700; text-align: center; padding: 24px; line-height: 1.35; }
.fcard.back { background: var(--okBg); border-color: var(--ok); font-weight: 400; }
.fcard .fsig { font-size: .42em; font-weight: 400; color: var(--muted); }
.fcard .fside { font-size: .5em; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
#printArea { display: none; }
@media print {
  @page { size: A4; margin: 10mm; }
  body > *:not(#printArea) { display: none !important; }
  body { background: #fff; }
  #printArea { display: block; color: #111; }
  .ppage { width: 190mm; height: 277mm; page-break-after: always; break-after: page; box-sizing: border-box; overflow: hidden; }
  .ppage.rules { font-size: 12pt; line-height: 1.5; }
  .ppage.rules h1 { font-size: 18pt; } .ppage.rules h2 { font-size: 14pt; margin-top: 8mm; }
  .ppage.grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); }
  .pcard { border: 1px dashed #777; padding: 5mm 6mm; display: flex; flex-direction: column; gap: 3mm; font-size: 12.5pt; line-height: 1.35; }
  .pcard .ph { font-size: 8.5pt; color: #555; display: flex; justify-content: space-between; gap: 4mm; text-transform: uppercase; letter-spacing: .4px; }
  .pcard .pq { flex: 1; display: flex; align-items: center; font-weight: 700; }
  .pcard.back .pq { font-weight: 400; }
  .pcard .pf { font-size: 8pt; color: #777; text-align: right; }
  .pcard.back { background: #F3F8F4; }
  .pcard.empty { border-color: transparent; }
}

/* Mention d'auteur (v8, 29/09/2026) */
.auteur { font-size: 13px; font-weight: 700; color: var(--accent); margin-top: 2px; }
footer .auteur-pied { font-weight: 700; color: var(--ink); margin-bottom: 4px; }
footer .licence { margin-bottom: 4px; }
footer .licence a { color: var(--accent); }
